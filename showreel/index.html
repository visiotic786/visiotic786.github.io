<style>
/* Layout: a projection room. The reel plays in a 16:9 stage at the top, a chapter rail underneath, then each category laid out as its own gallery. */
:root{
  --ink:#0e0b17;
  --panel:#171222;
  --line:#2b2340;
  --text:#f3effa;
  --mute:#a198b5;
  --accent:#7c3aed;
  --accent-hi:#a78bfa;
  --amber:#ffb020;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ink);color:var(--text);font:400 16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:60}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--accent-hi)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:20px;padding:10px 0}
.brand{font:700 17px var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--mute);font:500 13px var(--body);padding:7px 12px;border-radius:99px;border:1px solid transparent}
.chips a:hover{color:var(--text)}
.chips a.on{color:var(--text);border-color:var(--accent);background:rgba(124,58,237,.16)}

/* hero */
.hero{padding-block:24px 12px}
.player{width:min(100%,max(560px,calc((100svh - 250px) * 16 / 9)));margin-inline:auto}
.hero-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.hero-head h1{font-size:clamp(28px,5vw,52px);line-height:1;letter-spacing:-.03em}
.hero-head p{margin:0;color:var(--mute);font-size:14px;max-width:46ch}
.stage{position:relative;aspect-ratio:16/9;container-type:inline-size;background:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;isolation:isolate}
.sc{position:absolute;inset:0;overflow:hidden;color:var(--text)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes rise{from{transform:translateY(115%)}to{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(1.4cqw)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes kb1{from{transform:scale(1)}to{transform:scale(1.04)}}
@keyframes kb2{from{transform:scale(1.04)}to{transform:scale(1)}}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(7cqw,-5cqw) scale(1.2)}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
.sc.enter{animation:wipe .7s cubic-bezier(.7,0,.2,1) both}
.blobs{position:absolute;inset:0;z-index:0}
.blobs i{position:absolute;left:var(--x);top:var(--y);width:34cqw;height:34cqw;margin:-17cqw 0 0 -17cqw;border-radius:50%;background:var(--c);filter:blur(7cqw);opacity:.5;animation:drift 8s ease-in-out infinite alternate;animation-delay:var(--dl)}
.sc-intro,.sc-title,.sc-outro{background:var(--ink)}
.sc-intro>*:not(.blobs),.sc-title>*:not(.blobs),.sc-outro>*:not(.blobs){position:relative;z-index:1}
.kick{position:absolute!important;left:6cqw;top:5.5cqw;margin:0;font:600 clamp(9px,1.5cqw,16px) var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--text);opacity:.85;animation:fadeUp .8s .3s both}
.kin,.big{position:absolute!important;left:6cqw;right:6cqw;top:50%;transform:translateY(-52%);display:flex;flex-wrap:wrap;column-gap:2cqw;font-weight:700;letter-spacing:-.04em;line-height:.98}
.kin{font-size:10.5cqw}
.big{font-size:8.6cqw;top:44%}
.w{display:inline-flex;overflow:hidden;padding:0 .04em .1em;margin-bottom:-.1em}
.l{display:inline-block;animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.sub{position:absolute!important;left:6cqw;right:6cqw;bottom:5.5cqw;margin:0;font:500 clamp(11px,2cqw,22px) var(--body);color:var(--text);opacity:.9;animation:fadeUp .8s 1.3s both}
.sub b{color:var(--amber);font-weight:600}
.count{position:absolute!important;left:6cqw;top:66%;margin:0;font:600 clamp(11px,2.1cqw,24px) var(--display);color:var(--amber);animation:fadeUp .7s .8s both;display:flex;align-items:center;gap:1.4cqw}
.count::before{content:"";display:block;width:6cqw;height:.35cqw;background:var(--amber);transform-origin:left;animation:grow .8s .7s both}
.tthumbs{position:absolute!important;left:6cqw;right:6cqw;bottom:4.5cqw;display:flex;gap:1.2cqw;align-items:flex-end}
.tthumbs img{height:8.5cqw;width:auto;max-width:18cqw;object-fit:cover;border-radius:.8cqw;animation:pop .5s both;animation-delay:calc(.9s + var(--i) * .12s)}
.sc-img{background:var(--bg)}
.pic{position:absolute;inset:4cqw 7cqw 15cqw;display:grid;place-items:center}
.pic img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;animation-duration:var(--dur);animation-timing-function:linear;animation-fill-mode:both}
.pic img.k1{animation-name:kb1}
.pic img.k2{animation-name:kb2}
.cap{position:absolute;left:4cqw;right:4cqw;bottom:3cqw;display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw;color:var(--cc);animation:fadeUp .6s .35s both}
.cap div{min-width:0}
.cap small{display:block;font:600 clamp(8px,1.25cqw,13px) var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.cap strong{display:block;font:700 clamp(12px,2.3cqw,26px)/1.1 var(--display);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap span{flex:none;font:600 clamp(10px,1.6cqw,17px) var(--display);font-variant-numeric:tabular-nums;opacity:.8}
.sc-outro .big{font-size:9cqw;top:42%}
.contact-lines{position:absolute!important;left:6cqw;bottom:5.5cqw;margin:0;font:500 clamp(11px,2cqw,22px)/1.5 var(--body);animation:fadeUp .8s 1s both}
.contact-lines b{color:var(--amber);font-weight:600}
.stage.paused *,.stage.paused{animation-play-state:paused!important}
.stage.settle .sc,.stage.settle .sc *{animation-duration:.001s!important;animation-delay:0s!important}
.bigplay{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:rgba(14,11,23,.35);pointer-events:none}
.stage.userpaused .bigplay{display:grid}
.bigplay span{width:max(52px,9cqw);aspect-ratio:1;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.bigplay svg{width:42%;fill:#fff;margin-left:6%}

/* controls */
.controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0}
.ib:hover{border-color:var(--accent-hi)}
.ib svg{width:16px;height:16px;fill:currentColor}
.ib.main{background:var(--accent);border-color:var(--accent)}
.time{flex:none;font:500 13px var(--display);font-variant-numeric:tabular-nums;color:var(--mute);min-width:5.4em;text-align:right}
#seek{flex:1;min-width:0;height:20px;-webkit-appearance:none;appearance:none;background:transparent;margin:0;cursor:pointer}
#seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--accent-hi) var(--p,0%),var(--line) var(--p,0%))}
#seek::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
#seek::-moz-range-progress{height:5px;border-radius:3px;background:var(--accent-hi)}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-4.5px;border:0}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:12px}
.chap{position:relative;text-align:left;padding:10px 12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;min-width:0}
.chap:hover{border-color:var(--accent-hi)}
.chap.on{border-color:var(--accent)}
.chap .nm{display:block;font:600 13px/1.25 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap .ct{display:block;font:500 12px var(--body);color:var(--mute);margin-top:2px}
.chap .fill{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0) * 100%);background:var(--accent-hi)}

/* showcase */
.cat{padding-top:72px;scroll-margin-top:70px}
.cat-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.cat-head h2{font-size:clamp(26px,4vw,44px);letter-spacing:-.03em;line-height:1.05}
.cat-head p{margin:6px 0 0;color:var(--mute);max-width:56ch;font-size:15px}
.cat-head .n{font:600 14px var(--display);color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.mason{column-count:3;column-gap:16px}
.mason.two{column-count:2}
.card{display:block;width:100%;break-inside:avoid;margin:0 0 16px;padding:0;border:0;background:none;text-align:left}
.card .im{display:block;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .25s}
.card img{display:block;width:100%;height:auto;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.card:hover .im,.card:focus-visible .im{transform:translateY(-3px);border-color:var(--accent-hi)}
.card:hover img{transform:scale(1.025)}
.card .t{display:block;margin-top:9px;font:600 15px var(--display);letter-spacing:-.01em}
.card .s{display:block;margin-top:1px;font-size:13px;color:var(--mute);line-height:1.4}

/* madiotech build */
.build{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.bstage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#f0f0f0;aspect-ratio:1138/740}
.bstage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bstage .open{position:absolute;right:12px;bottom:12px;padding:8px 14px;border-radius:99px;border:0;background:rgba(14,11,23,.82);color:#fff;font:500 13px var(--body)}
.bstage .open:hover{background:var(--accent)}
.bcontrol{margin-top:14px;display:flex;align-items:center;gap:14px}
.bcontrol label{font:600 13px var(--display);color:var(--mute);white-space:nowrap}
#brange{flex:1;min-width:0;-webkit-appearance:none;appearance:none;background:transparent;height:20px;margin:0;cursor:pointer}
#brange::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--line) var(--p,0%))}
#brange::-moz-range-track{height:5px;border-radius:3px;background:var(--line)}
#brange::-moz-range-progress{height:5px;border-radius:3px;background:var(--amber)}
#brange::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px;border:0}
#brange::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:0}
.steps{display:grid;gap:10px}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.step img{width:96px;height:auto;border-radius:6px;display:block}
.step b{display:block;font:600 14px/1.25 var(--display)}
.step span{display:block;font-size:12px;color:var(--mute);margin-bottom:2px;letter-spacing:.08em;text-transform:uppercase}
.step:hover{border-color:var(--accent-hi)}
.step.on{border-color:var(--amber)}

/* contact */
.contact{margin-top:96px;padding:40px 0 56px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px}
.contact h2{font-size:clamp(30px,5vw,56px);letter-spacing:-.035em;line-height:1}
.contact p{color:var(--mute);margin:12px 0 0;max-width:46ch}
.clist{display:grid;gap:14px;align-content:start}
.clist div{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.clist dt{flex:0 0 100%;font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.clist dd{margin:0;font:500 17px var(--display);overflow-wrap:anywhere}
.clist{margin:0}
.copy{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font:500 12px var(--body)}
.copy:hover{border-color:var(--accent-hi)}

/* lightbox */
#lb{position:fixed;inset:0;z-index:100;background:rgba(8,6,13,.94);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:12px}
#lb figure{margin:0;display:contents}
#lb .pane{min-height:0;display:grid;place-items:center}
#lb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px}
#lb figcaption{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:center;text-align:center}
#lb figcaption strong{font:700 18px var(--display)}
#lb figcaption span{color:var(--mute);font-size:14px}
#lb .no{font:600 13px var(--display);font-variant-numeric:tabular-nums;color:var(--amber)}
.lbb{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;z-index:2}
.lbb:hover{border-color:var(--accent-hi)}
.lbb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#lb-x{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#lb-p{left:max(12px,env(safe-area-inset-left,0px));top:50%;margin-top:-22px}
#lb-n{right:max(12px,env(safe-area-inset-right,0px));top:50%;margin-top:-22px}

@media (max-width:900px){
  .mason{column-count:2}
  .rail{grid-template-columns:repeat(3,minmax(0,1fr))}
  .build{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .contact{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .mason,.mason.two{column-count:1}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .time{display:none}
  .cat{padding-top:56px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important;scroll-behavior:auto!important}
}
.back-to-portfolio{flex:none;text-decoration:none;color:var(--accent-hi);font:600 13px var(--body);padding:7px 14px;border-radius:99px;border:1px solid var(--accent);background:rgba(124,58,237,.12);white-space:nowrap;transition:background .25s}
.back-to-portfolio:hover{background:rgba(124,58,237,.28)}
</style>

<script>

function lbClose(){lb.hidden=true;document.body.style.overflow='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('#lb-x').onclick=lbClose;$('#lb-p').onclick=()=>lbShow(lbI-1);$('#lb-n').onclick=()=>lbShow(lbI+1);

/* ---------- Madiotech build slider ---------- */
const brange=$('#brange'),bimgs=[...document.querySelectorAll('#bstage img')],steps=[...document.querySelectorAll('.step')];
function setBuild(v){
  v=Math.max(0,Math.min(3,v));
  bimgs.forEach((im,i)=>{im.style.opacity=i===0?1:Math.max(0,Math.min(1,v-(i-1)))});
  brange.value=v;brange.style.setProperty('--p',(v/3*100)+'%');
  const n=Math.round(v);steps.forEach((s,i)=>s.classList.toggle('on',i===n));
}
let bTween=0;
function tweenBuild(to,ms){
  cancelAnimationFrame(bTween);
  const from=+brange.value,t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;setBuild(from+(to-from)*e);if(p<1)bTween=requestAnimationFrame(f)};
  bTween=requestAnimationFrame(f);
}
brange.addEventListener('input',()=>{cancelAnimationFrame(bTween);setBuild(+brange.value)});
steps.forEach((s,i)=>s.onclick=()=>tweenBuild(i,700));
$('#bopen').onclick=()=>lbOpen(IDX['mad'+(Math.round(+brange.value)+1)]);
setBuild(0);
new IntersectionObserver((en,ob)=>{if(en[0].isIntersecting){ob.disconnect();if(+brange.value===0)tweenBuild(3,4200)}},{threshold:.5}).observe($('#bstage'));

/* ---------- scroll spy ---------- */
const chipEls=[...document.querySelectorAll('.chips a')];
const spy=new IntersectionObserver(en=>{en.forEach(x=>{if(x.isIntersecting){chipEls.forEach(a=>a.classList.toggle('on',a.dataset.id===x.target.id));const a=chipEls.find(a=>a.dataset.id===x.target.id);if(a&&a.scrollIntoView)a.parentElement.scrollTo({left:a.offsetLeft-16,behavior:'smooth'})}})},{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.cat').forEach(s=>spy.observe(s));

/* ---------- copy ---------- */
$('#copyMail').onclick=async()=>{
  const b=$('#copyMail');

  catch(e){const r=document.createRange();r.selectNodeContents($('#mail'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'}
  setTimeout(()=>b.textContent='Copy',1800);
};

/* ---------- reel ---------- */
const stage=$('#stage'),layer=$('#layer'),seek=$('#seek');
const BLOBS=['#ffbe3d','#ff4d4d','#14e0ff','#e891ff','#6fd946'];
const blobsHTML='<div class="blobs">'+BLOBS.map((c,i)=>'<i style="--c:'+c+';--x:'+[12,82,48,26,90][i]+'%;--y:'+[20,28,92,86,84][i]+'%;--dl:-'+(i*1.7)+'s"></i>').join('')+'</div>';
const scenes=[{type:'intro',dur:3400}];
CATS.forEach((c,ci)=>{
  scenes.push({type:'title',ci,dur:1700});
  c.items.forEach((d,j)=>scenes.push({type:'img',ci,d,j,dur:c.id==='madiotech'?1500:(c.long?2700:2000)}));

scenes.push({type:'outro',dur:3600});
let total=0;scenes.forEach(s=>{s.start=total;total+=s.dur});
const chapters=CATS.map((c,ci)=>{const a=scenes.find(s=>s.ci===ci&&s.type==='title');const b=scenes.filter(s=>s.ci===ci).pop();return{start:a.start,end:b.start+b.dur,idx:scenes.indexOf(a)}});
const rail=[...document.querySelectorAll('.chap')];
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+pad(s%60)};

function words(text,base){
  let n=0;
  return text.split(' ').map(w=>'<span class="w">'+[...w].map(ch=>'<span class="l" style="--d:'+(base+(n++)*0.035).toFixed(3)+'s">'+esc(ch)+'</span>').join('')+'</span>').join('');
}
function lum(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255}

let t=0,cur=-1,last=performance.now(),want=!matchMedia('(prefers-reduced-motion: reduce)').matches,onScreen=true,dragging=false;

function render(i){

    el.innerHTML=blobsHTML+'<p class="kick">Muhammad Anas &middot; Muzaffarabad, Pakistan</p><h2 class="kin" role="presentation">'+words('Graphic Design Showreel',.15)+'</h2><p class="sub">Lettering <b>/</b> Logos <b>/</b> Neon <b>/</b> Branding <b>/</b> Print <b>/</b> Web</p>';
  }else if(s.type==='title'){
    const c=CATS[s.ci];
    el.innerHTML=blobsHTML+'<p class="kick">Chapter '+(s.ci+1)+' of '+CATS.length+'</p><h2 class="big">'+words(c.name,.1)+'</h2><p class="count">'+pad(c.items.length)+' works</p><div class="tthumbs">'+c.items.map((d,k)=>'<img style="--i:'+k+'" src="'+d.f+'" alt="">').join('')+'</div>';
  }else if(s.type==='img'){
    const d=s.d,c=CATS[s.ci];
    el.style.setProperty('--bg',d.bg);el.style.setProperty('--cc',lum(d.bg)>.55?'#15101f':'#ffffff');

  }else{
    el.innerHTML=blobsHTML+'<p class="kick">Thanks for watching</p><h2 class="big">'+words("Let's work together",.1)+'</h2><p class="contact-lines">visiospectra786@gmail.com<br><b>WhatsApp</b> +92 317 5251823</p>';
  }
  const first=!layer.firstChild;
  if(!first&&playing)el.classList.add('enter');
  stage.classList.toggle('settle',!playing&&!onHold());
  layer.appendChild(el);el.style.zIndex=2;
  [...layer.children].forEach(o=>{if(o!==el){o.style.zIndex=1;setTimeout(()=>o.remove(),850)}});
}
function onHold(){return false}
function sceneAt(ms){let i=0;while(i<scenes.length-1&&ms>=scenes[i].start+scenes[i].dur)i++;return i}
function setPlaying(p){
  playing=p&&onScreen&&!document.hidden;
  stage.classList.toggle('paused',!playing);
  stage.classList.toggle('userpaused',!want);
  $('#icoPause').hidden=!want;$('#icoPlay').hidden=want;
  $('#bPlay').setAttribute('aria-label',want?'Pause':'Play');
}
function seekTo(ms,force){
  t=Math.max(0,Math.min(total-1,ms));cur=-1;
  const i=sceneAt(t);
  // restart the scene from its first frame so its animation plays from the start
  t=scenes[i].start;
  render(i);
}
function tick(now){
  const dt=Math.min(now-last,100);last=now;
  if(playing&&!dragging){t+=dt;if(t>=total)t-=total}
  const i=sceneAt(t);
  if(i!==cur)render(i);
  if(!dragging){seek.value=Math.round(t/total*1000);seek.style.setProperty('--p',(t/total*100)+'%')}
  $('#time').textContent=fmt(t)+' / '+fmt(total);
  chapters.forEach((c,k)=>{
    const p=Math.max(0,Math.min(1,(t-c.start)/(c.end-c.start)));
    rail[k].style.setProperty('--p',p);rail[k].classList.toggle('on',t>=c.start&&t<c.end);
  });
  requestAnimationFrame(tick);
}
$('#bPlay').onclick=()=>{want=!want;setPlaying(want);if(want&&!stage.querySelector('.sc'))render(sceneAt(t))};
stage.addEventListener('click',()=>{want=!want;setPlaying(want)});

$('#bNext').onclick=()=>{const i=Math.min(scenes.length-1,sceneAt(t)+1);seekTo(scenes[i].start)};
$('#bPrev').onclick=()=>{const i=sceneAt(t);const into=t-scenes[i].start;seekTo(scenes[into>900?i:Math.max(0,i-1)].start)};
rail.forEach((b,k)=>b.onclick=()=>seekTo(chapters[k].start));
seek.addEventListener('input',()=>{dragging=true;seekTo(seek.value/1000*total)});
seek.addEventListener('change',()=>{dragging=false});
seek.addEventListener('pointerup',()=>{dragging=false});
document.addEventListener('visibilitychange',()=>setPlaying(want));
new IntersectionObserver(en=>{onScreen=en[0].isIntersecting;setPlaying(want)},{threshold:.3}).observe(stage);
setPlaying(want);
requestAnimationFrame(now=>{last=now;tick(now)});
</script>
